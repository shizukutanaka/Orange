# Gradle properties. Each flag is here for one reason; the comment explains it.

# 2GB heap — enough for a single-module app, not wasteful on CI runners
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build in parallel where safe (single module now, but costs nothing to enable)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX only. No legacy support library.
android.useAndroidX=true

# R8 full mode — more aggressive shrinking; required to hit <200KB release APK goal.
android.enableR8.fullMode=true

# Non-transitive R classes — each module only sees its own R symbols.
# Catches accidental cross-module resource coupling at build time.
android.nonTransitiveRClass=true

# Kotlin official code style (not the IntelliJ default)
kotlin.code.style=official
