# Orange CI. Privacy guard first; lint and tests in parallel; build gates on both.
# Wrapper jar is not committed; setup steps fetch it.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  privacy-guard:
    name: Privacy guard + decision oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No network code in app/src/main
        run: bash tools/check_no_network.sh app/src/main
      - name: Decision oracle (behavioral tripwire)
        run: python3 tools/oracle_decision.py
      - name: Comprehensive static checks
        run: bash tools/check_comprehensive.sh

  lint:
    name: Lint (Android + Kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: privacy-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
      - run: ./gradlew lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: privacy-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
      - run: ./gradlew testReleaseUnitTest --no-daemon
      - name: Verify decision oracle agrees with Kotlin rules
        run: python3 tools/oracle_decision.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

  build:
    name: Assemble release (R8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar
          fi
      - run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK size
        run: bash tools/check_apk_size.sh
      - uses: actions/upload-artifact@v4
        with:
          name: orange-release-unsigned
          path: app/build/outputs/apk/release/*.apk
