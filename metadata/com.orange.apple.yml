AutoName: Orange
Description: |
  Your phone stops ringing when it shouldn't.

  Orange is an offline-only call blocker. No account, no server, no contact
  upload, no ads, no subscription. Emergency numbers always ring through.

  What Orange does NOT do: it does not read your contacts, does not connect
  to any server, and does not include any analytics or advertising SDK.
  See PRIVACY_MANIFESTO.md in the source repository.

